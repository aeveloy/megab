# Runs on every push so the Discord bot (gittrack.me, "workflow_run" event) pings the server.
name: Push

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: |
          echo "Pushed by ${{ github.actor }}"
          echo "${{ github.event.head_commit.message }}"
